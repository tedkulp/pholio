version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gosec
    - misspell
    - revive
    - unconvert
  settings:
    gosec:
      excludes:
        # pholio is an editor: it reads and writes user-chosen paths, and
        # Notes and folders get ordinary 0644/0755 permissions.
        - G301
        - G304
        - G306

formatters:
  enable:
    - gofmt
    - goimports
