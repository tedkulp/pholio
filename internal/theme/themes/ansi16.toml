# A theme using only the terminal's 16 ANSI colours, so it follows whatever
# colour scheme the terminal already has.

[palette]
bg       = "0"
surface  = "8"
overlay  = "8"
muted    = "8"
text     = "7"
subtext  = "7"
accent   = "4"
green    = "2"
yellow   = "3"
red      = "1"
mauve    = "5"
teal     = "6"
peach    = "3"

[ui]
statusline = { fg = "15", bg = "8" }
status_file = { fg = "15", bg = "8", bold = true }
status_dirty = { fg = "11", bg = "8", bold = true }

# ---- syntax in fenced code blocks; other tokens use markdown.code ----
[code]
keyword          = { fg = "mauve" }
string           = { fg = "green" }
comment          = { fg = "muted", italic = true }
number           = { fg = "peach" }
type             = { fg = "yellow" }
function         = { fg = "accent" }
operator         = { fg = "teal" }
